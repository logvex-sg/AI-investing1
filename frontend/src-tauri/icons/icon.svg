<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0b1a2e"/>
      <stop offset="55%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03050b"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#edge)" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Overseer at the centre -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="34" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="256" cy="256" r="13" fill="#8b5cf6"/>
  </g>

  <!-- Eight agents on a ring, connected to the Overseer -->
  <g stroke="#38bdf8" stroke-opacity="0.5" stroke-width="3">
    <line x1="256" y1="256" x2="256" y2="104"/>
    <line x1="256" y1="256" x2="363" y2="148"/>
    <line x1="256" y1="256" x2="408" y2="256"/>
    <line x1="256" y1="256" x2="363" y2="364"/>
    <line x1="256" y1="256" x2="256" y2="408"/>
    <line x1="256" y1="256" x2="149" y2="364"/>
    <line x1="256" y1="256" x2="104" y2="256"/>
    <line x1="256" y1="256" x2="149" y2="148"/>
  </g>

  <g fill="#0b1220" stroke="#22d3ee" stroke-width="5">
    <circle cx="256" cy="104" r="21"/>
    <circle cx="363" cy="148" r="21"/>
    <circle cx="408" cy="256" r="21"/>
    <circle cx="363" cy="364" r="21"/>
    <circle cx="256" cy="408" r="21"/>
    <circle cx="149" cy="364" r="21"/>
    <circle cx="104" cy="256" r="21"/>
    <circle cx="149" cy="148" r="21"/>
  </g>
</svg>
